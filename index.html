<!DOCTYPE html>
<html>
<head>
  <title>Simple Whiteboard</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
    }

    #board {
      width: 100vw;
      height: 100vh;
      background: #f5f5f5;
      position: relative;
      cursor: crosshair;
    }

    .note {
      position: absolute;
      min-width: 80px;
      min-height: 30px;
      padding: 5px;
      border: 1px solid #333;
      background: white;
      cursor: move;
      user-select: none;
    }

    .selected {
      border: 2px solid blue;
    }

    #toolbar {
      position: fixed;
      top: 10px;
      left: 10px;
      background: white;
      border: 1px solid #ccc;
      padding: 8px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <button onclick="deleteNote()">Delete Selected</button>
</div>

<div id="board"></div>

<script>
let board = document.getElementById("board");
let selected = null;

// Create note on click
board.addEventListener("click", function(e) {
  if (e.target !== board) return;

  let note = document.createElement("div");
  note.className = "note";
  note.contentEditable = false;
  note.innerText = "New Note";

  note.style.left = e.clientX + "px";
  note.style.top = e.clientY + "px";

  addNoteEvents(note);
  board.appendChild(note);
});

// Add interactions
function addNoteEvents(note) {
  let offsetX, offsetY, dragging = false;

  note.addEventListener("mousedown", function(e) {
    selected = note;
    setSelected(note);

    dragging = true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;
  });

  document.addEventListener("mousemove", function(e) {
    if (!dragging) return;
    note.style.left = (e.clientX - offsetX) + "px";
    note.style.top = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup", function() {
    dragging = false;
  });

  // Double click to edit
  note.addEventListener("dblclick", function() {
    note.contentEditable = true;
    note.focus();
  });

  // Stop editing on blur
  note.addEventListener("blur", function() {
    note.contentEditable = false;
  });

  // Select on click
  note.addEventListener("click", function(e) {
    e.stopPropagation();
    selected = note;
    setSelected(note);
  });
}

// Highlight selected
function setSelected(note) {
  document.querySelectorAll(".note").forEach(n => n.classList.remove("selected"));
  note.classList.add("selected");
}

// Delete selected
function deleteNote() {
  if (selected) {
    selected.remove();
    selected = null;
  }
}
</script>

</body>
</html>
