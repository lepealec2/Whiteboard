<!DOCTYPE html>
<html>
<head>
    <title>Whiteboard Version 1.0</title>
    <title>Simple Whiteboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f5f5;
    }

    #toolbar {
      padding: 10px;
      background: white;
      border-bottom: 1px solid #ccc;
    }

    #boardBox {
      width: 90%;
      height: 70vh;
      margin: 20px auto;
      padding: 10px;
      border: 2px solid #333;
      outline: none;
      overflow: auto;
      background: #ffffff;
      color: #000000;
      font-size: 36px;
    }

    button, input {
      margin: 3px;
    }
  </style>
</head>

<body>

<div id="toolbar">

  Text Color:
  <input type="color" id="textColor" value="#000000">

  Box Color:
  <input type="color" id="boxColor" value="#ffffff">

  Text Size:
  <input type="number" id="fontSize" value="36" min="5" max="200"> px

  <br>

  <button onclick="undoText()">Undo</button>
  <button onclick="resetDefaults()">Reset</button>
  <button onclick="toggleBox()">Hide/Show</button>

</div>


<div id="boardBox" contenteditable="true">
Type here...
</div>


<script>

let box = document.getElementById("boardBox");
let history = [];
let visible = true;


// Save text changes
box.addEventListener("input", function() {
  history.push(box.innerHTML);

  if (history.length > 50) {
    history.shift();
  }
});


// Undo last text change
function undoText() {
  if (history.length > 0) {
    box.innerHTML = history.pop();
  }
}


// Change text color immediately
document.getElementById("textColor").addEventListener("input", function() {
  box.style.color = this.value;
});


// Change box color immediately
document.getElementById("boxColor").addEventListener("input", function() {
  box.style.background = this.value;
});


// Change text size immediately
document.getElementById("fontSize").addEventListener("input", function() {
  box.style.fontSize = this.value + "px";
});


// Reset all settings
function resetDefaults() {

  document.getElementById("textColor").value = "#000000";
  document.getElementById("boxColor").value = "#ffffff";
  document.getElementById("fontSize").value = 36;

  box.style.color = "#000000";
  box.style.background = "#ffffff";
  box.style.fontSize = "36px";
}


// Hide/show whiteboard
function toggleBox() {
  visible = !visible;
  box.style.display = visible ? "block" : "none";
}

</script>

</body>
</html>
