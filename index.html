<!DOCTYPE html>
<html>
<head>
  <title>Whiteboard Simulator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f5f5;
    }

    #pageTitle {
      text-align: center;
      font-size: 36px;
    }

    #toolbar {
      padding: 10px;
      background: white;
      border-bottom: 1px solid #ccc;
      font-size: 36px;
    }

    input, button {
      margin: 3px;
      font-size: 36px;
    }

    #nameBox {
      width: 90%;
      margin: 10px auto;
      display: block;
      font-size: 36px;
      padding: 5px;
    }

    #boardBox {
      width: 90%;
      height: 70vh;
      margin: 20px auto 5px auto;
      padding: 10px;
      border: 2px solid #333;
      outline: none;
      overflow: auto;
      background: #ffffff;
      color: #000000;
      font-size: 100px;
      text-align: left;
    }

    #bottomControls {
      text-align: center;
      margin-top: 10px;
    }
  </style>

</head>

<body>

<h1 id="pageTitle">Simple Whiteboard</h1>


<input id="nameBox" placeholder="Name">


<div id="toolbar">

  Text Color:
  <input type="color" id="textColor" value="#000000">

  Box Color:
  <input type="color" id="boxColor" value="#ffffff">

  Text Size:
  <input type="number" id="fontSize" value="100" min="5" max="200"> px

  <br>

  <button onclick="resetDefaults()">Reset</button>
  <button onclick="toggleCenter()">Center</button>
  <button onclick="toggleBox()">Hide/Show</button>

</div>


<div id="boardBox" contenteditable="true"></div>


<div id="bottomControls">
  <button onclick="clearBoard()">Clear</button>
</div>


<script>

let box = document.getElementById("boardBox");
let visible = true;
let centered = false;


// Live text color
document.getElementById("textColor").addEventListener("input", function() {
  box.style.color = this.value;
});


// Live box color
document.getElementById("boxColor").addEventListener("input", function() {
  box.style.background = this.value;
});


// Live text size
document.getElementById("fontSize").addEventListener("input", function() {
  box.style.fontSize = this.value + "px";
});


// Center toggle
function toggleCenter() {
  centered = !centered;
  box.style.textAlign = centered ? "center" : "left";
}


// Clear board
function clearBoard() {
  box.innerHTML = "";
}


// Reset defaults
function resetDefaults() {

  document.getElementById("textColor").value = "#000000";
  document.getElementById("boxColor").value = "#ffffff";
  document.getElementById("fontSize").value = 100;

  box.style.color = "#000000";
  box.style.background = "#ffffff";
  box.style.fontSize = "100px";
  box.style.textAlign = "left";

  centered = false;
}


// Hide/show
function toggleBox() {
  visible = !visible;
  box.style.display = visible ? "block" : "none";
}

</script>

</body>
</html>
