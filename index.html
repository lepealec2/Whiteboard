<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whiteboard</title>
<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <text y='.9em' font-size='90'>📝</text>
</svg>">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
  text-align:center;
}

/* NAME */
#nameBox {
  width:90%;
  margin:10px auto;
  display:block;
  font-size:100px;
  padding:5px;
  text-align:center;
  box-sizing:border-box;
}

/* TOP BUTTONS */
.row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:5px 0;
  flex-wrap:wrap;
}

/* TOOLBAR */
#toolbar {
  background:#ddd;
  padding:10px;
  font-size:18px;
}

/* BUTTONS */
button {
  font-size:18px;
  padding:5px 10px;
}

/* INPUTS */
input {
  font-size:18px;
  padding:5px;
}


/* BOARD */
#boardContainer {
  width:90%;
  height:70vh;
  margin:20px auto 80px auto;
}


#boardBox {
  width:100%;
  height:100%;
  padding:10px;
  border:2px solid #333;
  outline:none;
  overflow:auto;
  background:white;
  color:black;
  font-size:100px;
  text-align:left;
  box-sizing:border-box;
}


/* BOTTOM BUTTON BAR */
#bottomControls {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#ddd;
  padding:10px;
  border-top:2px solid #aaa;
}


#bottomControls .row {
  display:flex;
  justify-content:space-evenly;
  align-items:center;
  flex-wrap:nowrap;
  gap:20px;
}


#bottomControls button {
  flex:1;
  max-width:220px;
}

</style>

</head>

<body>




<input id="nameBox" placeholder="Name">



<div class="row">

<button onclick="toggleBox()">
Hide/Show Board
</button>

<button onclick="toggleName()">
Hide/Show Name
</button>


</div>



<div id="toolbar">


<div class="row">

Text Color:

<input 
type="color" 
id="textColor" 
value="#000000">


Box Color:

<input 
type="color" 
id="boxColor" 
value="#ffffff">

</div>



<div class="row">

Text Size:

<button onclick="changeSize(-10)">
-10
</button>


<input 
type="number"
id="fontSize"
value="100"
min="5"
max="200">


<button onclick="changeSize(10)">
+10
</button>

px

</div>






</div>



<div id="boardContainer">

<div id="boardBox" contenteditable="true"></div>

</div>


<div id="bottomControls">

<div class="row">

<button onclick="clearText()">
Clear Text
</button>

<button onclick="resetFormats()">
Reset Formats
</button>

<button onclick="toggleCenter()">
Center
</button>

<button onclick="toggleSettings()">
Hide/Show Settings
</button>

</div>

</div>


<script>


let box=document.getElementById("boardBox");
let nameBox=document.getElementById("nameBox");

let visible=true;
let centered=false;



document.getElementById("textColor")
.addEventListener("input",function(){

box.style.color=this.value;

});



document.getElementById("boxColor")
.addEventListener("input",function(){

box.style.background=this.value;

});



document.getElementById("fontSize")
.addEventListener("input",function(){

box.style.fontSize=this.value+"px";

nameBox.style.fontSize=this.value+"px";

});



function changeSize(amount){

let input=document.getElementById("fontSize");

let size=parseInt(input.value)+amount;


if(size<5)
size=5;

if(size>200)
size=200;


input.value=size;


box.style.fontSize=size+"px";

nameBox.style.fontSize=size+"px";

}



function toggleCenter(){

centered=!centered;

box.style.textAlign =
centered ? "center" : "left";

}



function clearText(){

box.innerHTML="";

}



function resetFormats(){

document.getElementById("textColor").value="#000000";

document.getElementById("boxColor").value="#ffffff";

document.getElementById("fontSize").value=100;


box.style.color="#000000";

box.style.background="#ffffff";

box.style.fontSize="100px";

box.style.textAlign="left";


nameBox.style.fontSize="100px";


centered=false;

}



function toggleBox(){

visible=!visible;


document.getElementById("boardContainer").style.display =
visible ? "block" : "none";

}



function toggleName(){

nameBox.style.display =
nameBox.style.display==="none"
? "block"
: "none";

}



function toggleSettings(){

let toolbar=document.getElementById("toolbar");


toolbar.style.display =
toolbar.style.display==="none"
? "block"
: "none";

}


</script>


</body>
</html>
